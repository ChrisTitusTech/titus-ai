approval_policy = "never"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "low"
sandbox_mode = "danger-full-access"

[features]
fast_mode = false
memories = true

# Trusted project paths are rendered at install time for the current user's
# ~/github directory and discovered worktrees. Do not commit personal absolute
# paths in this public repository.

[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[desktop]
followUpQueueMode = "queue"

[windows]
sandbox = "elevated"
